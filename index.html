<title>人生設計図</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F3F6FA; --grid:rgba(46,111,216,.075); --ink:#1E3350; --sub:#5B6B82; --line:#CBD7E6;
  --card:#FFFFFF; --accent:#2E6FD8; --accent-soft:#E3ECFA; --gold:#C98A17; --gold-soft:#FBF0D9;
  --green:#2F8F66; --red:#C94A3D; --red-soft:#FBE7E4; --shadow:0 1px 0 rgba(30,51,80,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1A2B; --grid:rgba(120,170,240,.08); --ink:#E4ECF7; --sub:#93A4BC; --line:#2A3C57;
    --card:#16243A; --accent:#6FA3F2; --accent-soft:#1D3354; --gold:#E9B24E; --gold-soft:#3A2F17;
    --green:#5CC08E; --red:#EE7B6D; --red-soft:#43221F; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1A2B; --grid:rgba(120,170,240,.08); --ink:#E4ECF7; --sub:#93A4BC; --line:#2A3C57;
  --card:#16243A; --accent:#6FA3F2; --accent-soft:#1D3354; --gold:#E9B24E; --gold-soft:#3A2F17;
  --green:#5CC08E; --red:#EE7B6D; --red-soft:#43221F; --shadow:none; color-scheme:dark;
}
html{background:var(--paper);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:1.75rem;font-weight:900;letter-spacing:.02em;line-height:1.3;margin:8px 0 4px}
h2{font-size:1.05rem;font-weight:700;margin:32px 0 10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;border-top:1.5px dashed var(--line)}
h3{font-size:1.05rem;margin:0;line-height:1.45}
p{margin:0}
.lead{color:var(--sub)}
.muted{color:var(--sub);font-size:.9rem}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.btn{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;min-height:44px}
:root[data-theme="dark"] .btn{color:#0F1A2B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0F1A2B}}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{padding:6px 14px;min-height:36px;font-size:.9rem}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---- ruler (hero) ---- */
.ruler-box{margin:18px -6px 4px;overflow-x:auto}
.ruler{display:block;width:100%;min-width:320px;height:auto}
.ruler .tk{stroke:var(--sub);stroke-width:1.5}
.ruler .tk.big{stroke:var(--ink);stroke-width:2.5}
.ruler .tl{fill:var(--sub);font-size:26px;text-anchor:middle;font-weight:500}
.ruler .ax-past{stroke:var(--accent);stroke-width:8;stroke-linecap:round}
.ruler .ax-fut{stroke:var(--accent);stroke-width:4;stroke-dasharray:10 8;opacity:.55}
.ruler .ret{stroke:var(--sub);stroke-width:2;stroke-dasharray:4 5}
.ruler .retl{fill:var(--sub);font-size:22px}
.ruler .now line{stroke:var(--accent);stroke-width:2.5}
.ruler .now rect{fill:var(--accent)}
.ruler .now text{fill:var(--paper);font-size:26px;font-weight:700;text-anchor:middle}
.ruler .gm{fill:var(--gold);stroke:var(--gold);stroke-width:3}
.ruler .gm.open{fill:var(--card)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--sub);margin:0 0 4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend i.dia{border-radius:1px;transform:rotate(45deg);background:var(--gold)}

.facts{padding:0}
.fact{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.fact:first-child{border-top:0}
.fact .k{color:var(--sub);font-size:.9rem;flex-shrink:0}
.fact .v{text-align:right;font-weight:700}
.fact .v small{display:block;font-weight:400;color:var(--sub);font-size:.8rem}
.warn{color:var(--red)}
.progress{height:8px;background:var(--accent-soft);border-radius:99px;overflow:hidden;margin-top:6px;min-width:120px}
.progress>div{height:100%;background:var(--gold);border-radius:99px}

.soon{list-style:none;margin:0;padding:0}
.soon li{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:center}
.soon .yrs{font-weight:900;color:var(--accent);font-size:.95rem}
.soon .yrs small{display:block;font-weight:400;color:var(--sub);font-size:.75rem}

/* ---- timeline ---- */
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--sub);margin:4px 0 12px;min-height:40px}
.switch input{width:20px;height:20px;accent-color:var(--accent)}

const CATS = {
  work:{l:'仕事',c:'#2E6FD8'}, family:{l:'家族',c:'#D0648E'}, home:{l:'住まい',c:'#9B6B3F'},

};

  o.goals.forEach(g => { if(!Array.isArray(g.steps)) g.steps = []; });
  o.events.forEach(e => { if(!e.who) e.who = 'me'; });

function sim(){

    m.expenses.forEach(i => { if(a>=i.from && a<=i.to) exp += num(i.amount); });
    S.events.forEach(e => { if(e.year===yr && e.amt) one += (e.dir==='in' ? 1 : -1) * num(e.amt); });

    one += talkMoneyByYear(yr);

function rulerRange(){
  const p=P(), L=p.lifespan;
  let r0=Number.isFinite(+p.rulerFrom)&&p.rulerFrom!=='' ? +p.rulerFrom : 0;

  r0=Math.max(0,Math.min(r0,L-1)); r1=Math.max(r0+1,Math.min(r1,L));
  return {r0, r1, full: r0===0 && r1===L};
}
// 生年月日からの経過年数（小数）。月がなければ年の中ほど
function fracAge(yr, mo){
  const b=bparts(meP());
  const t = yr + ((mo ? mo : 6.5) - 1) / 12 + (mo ? 0.5/12 : 0);
  const born = b.y + ((b.m||1) - 1) / 12 + ((b.d||15) - 1) / 365;
  return t - born;
}
function ruler(){
  const p=P(), {r0,r1}=rulerRange(), span=r1-r0, a0=realNow(), W=1000, x0=30, x1=970, ax=150;
  const X = a => x0 + (x1-x0) * (a - r0) / span;
  const inR = a => a >= r0 && a <= r1;
  const major = span<=15 ? 1 : span<=30 ? 5 : 10, mid = span<=15 ? 0 : span<=30 ? 0 : 5;
  const nowF = fracAge(Y, M) + (TD-15)/365;
  let s = `<svg viewBox="0 0 ${W} 205" class="ruler" role="img" aria-label="${r0}歳から${r1}歳までの人生の物差し。いま${a0}歳">`;
  const nowC = Math.min(Math.max(nowF, r0), r1);
  if(nowC > r0) s += `<line x1="${x0}" x2="${X(nowC)}" y1="${ax}" y2="${ax}" class="ax-past"/>`;
  if(nowC < r1) s += `<line x1="${X(nowC)}" x2="${x1}" y1="${ax}" y2="${ax}" class="ax-fut"/>`;
  for(let a=r0; a<=r1; a++){
    const x=X(a), big=a%major===0, md=mid && a%mid===0;
    s += `<line x1="${x}" x2="${x}" y1="${ax+6}" y2="${ax+(big?24:md?16:10)}" class="tk${big?' big':''}"/>`;
    if(big) s += `<text x="${x}" y="${ax+52}" class="tl">${a}</text>`;
  }
  if(p.retireAge>=r0 && p.retireAge<=r1){
    const rx=X(p.retireAge);
    s += `<line x1="${rx}" x2="${rx}" y1="${ax-78}" y2="${ax}" class="ret"/><text x="${rx+8}" y="${ax-64}" class="retl">退職 ${p.retireAge}歳</text>`;
  }
  const stack = {};
  const slot = a => { const k=Math.round(X(a)/20); stack[k]=(stack[k]||0)+1; return Math.max(58, ax-18-(stack[k]-1)*20); };
  allEvents().forEach(e => {
    const a=fracAge(e.year, num(e.month)||0); if(!inR(a)) return;
    s += `<circle cx="${X(a)}" cy="${slot(a)}" r="8" fill="${(CATS[e.cat]||CATS.other).c}"><title>${h(ymLabel(e)+' '+e.title)}</title></circle>`;
  });
  S.goals.slice().sort((a,b)=>a.age-b.age).forEach(g => {
    const a=g.age+0.5; if(!inR(a)) return; const x=X(a), y=slot(a);
    s += `<path d="M${x} ${y-9} L${x+9} ${y} L${x} ${y+9} L${x-9} ${y} Z" class="gm${g.done?'':' open'}"><title>${h(g.age+'歳 目標：'+g.title)}</title></path>`;
  });
  if(inR(nowF)){
    const nx = X(nowF), lx = Math.min(Math.max(nx, 95), W-95);
    s += `<g class="now"><line x1="${nx}" x2="${nx}" y1="46" y2="${ax+8}"/><rect x="${lx-78}" y="4" width="156" height="42" rx="21"/><text x="${lx}" y="34">いま ${a0}歳</text></g>`;
  }
  return s + `</svg>`;
}

    <p class="lead">いま${a0}歳。${p.lifespan}歳まで、あと${p.lifespan-a0}年ぶんの設計図です。</p>
    ${p.birthDate?'':`<p class="muted" style="margin-top:6px">生年月日を登録すると、実年齢で表示されます。<button class="link" onclick="go('settings')">設定で登録する</button></p>`}

    <div class="ruler-box">${ruler()}</div>`;
  if(cats.length || gt){
    out += `<div class="legend">${cats.map(c=>`<span><i style="background:${(CATS[c]||CATS.other).c}"></i>${(CATS[c]||CATS.other).l}</span>`).join('')}${gt?'<span><i class="dia"></i>目標</span>':''}</div>`;
  }
  out += `<h2>いまの見通し</h2><div class="panel facts">
    <div class="fact"><span class="k">次の予定</span><span class="v">${next?`${next.who&&next.who!=='me'?h(personOf(next.who).name)+'　':''}${h(next.title)}<small>${ymLabel(next)}（${next.year===Y?'今年':'あと'+(next.year-Y)+'年'}）</small>`:'<small>年表にイベントを追加しましょう</small>'}</span></div>
    <div class="fact"><span class="k">目標の達成</span><span class="v">${gt?`${gd} / ${gt}<div class="progress"><div style="width:${gt?gd/gt*100:0}%"></div></div>`:'<small>まだ目標がありません</small>'}</span></div>
    <div class="fact"><span class="k">${ret?`退職時（${p.retireAge}歳）の貯蓄`:`${p.lifespan}歳時点の貯蓄`}</span><span class="v">${hasMoney?`<span class="${(ret||last).bal<0?'warn':''}">${fm((ret||last).bal)}</span>`:'<small>お金のタブで入力できます</small>'}</span></div>
    ${hasMoney && neg ? `<div class="fact"><span class="k warn">注意</span><span class="v warn">${rowAge(meP(),neg.yr)}歳（${neg.yr}年）で貯蓄がマイナスになります<small>お金のタブで収支を見直せます</small></span></div>`:''}
    ${hasMoney && !neg && ret ? `<div class="fact"><span class="k">${p.lifespan}歳時点の貯蓄</span><span class="v">${fm(last.bal)}</span></div>`:''}

/* ---------- timeline ---------- */
function chipEv(e){
  const c = CATS[e.cat]||CATS.other;
  return `<button class="chip" style="--c:${c.c}" onclick="editEvent('${e.id}')"><span class="cat">${c.l}</span>${whoTag(e)}${monthTag(e)}${h(e.title)}${e.amt?`<span class="amt ${e.dir==='in'?'in':'out'}">${e.dir==='in'?'+':'−'}${fm(num(e.amt))}</span>`:''}</button>`;
}
function chipGoal(g){
  return `<button class="chip goal ${g.done?'done':''}" onclick="goGrowth('goals')"><span class="cat">目標</span>${h(g.title)}</button>`;
}
function vTimeline(){
  const p=P(), a0=nowAge();
  const mode = tlMode || (p.family.length ? 'family' : 'list');
  let out = `<div class="bar"><h1>年表</h1><button class="btn small" onclick="editEvent()">＋ イベント</button></div>
    <div class="seg" role="group" aria-label="表示の切り替え">
      <button aria-pressed="${mode==='family'}" onclick="tlMode='family';render()">家族一覧表</button>
      <button aria-pressed="${mode==='list'}" onclick="tlMode='list';render()">リスト</button>
    </div><br>
    <label class="switch"><input type="checkbox" ${tlOnlyFilled?'checked':''} onchange="tlOnlyFilled=this.checked;render()">予定のある年だけ表示</label>`;
  if(mode==='family') return out + vFamilyTable();
  const past = allEvents().filter(e=>e.year<Y).sort((a,b)=>a.year-b.year);
  if(past.length){
    out += `<details><summary>これまでの出来事（${past.length}件）</summary><ul class="past">${past.map(e=>`<li><span class="muted">${evAge(meP(),e)}歳（${ymLabel(e)}）</span> ${chipEv(e)}</li>`).join('')}</ul></details>`;
  }
  out += `<ol class="tl">`;
  let lastDec=null, noted=false;
  tlSlots().forEach(s=>{
    const {yr,a}=s, filled=s.events.length+s.goals.length>0;
    const d0=Math.floor(rowAge(meP(),yr)/10)*10;
    if(d0!==lastDec){ out += `<li class="dec">${d0}代</li>`; lastDec=d0; }
    const fam = (filled && s.first) ? p.family.map(f=>{const fa=famAge(f,yr); return fa!==null ? `${h(f.name)} ${yr===bparts(f).y?'誕生':fa+'歳'}` : '';}).filter(Boolean).join('　') : '';
    const ret = s.first && a===p.retireAge;
    const when = `<b>${rowAge(meP(),yr)}歳</b><span>${yr}年</span>`;
    out += `<li class="yr ${s.q!==0?'q':''} ${filled?'':'empty'} ${s.now?'now':''} ${ret?'ret':''} ${s.first&&s.q!==0?'ystart':''} ${s.past?'past':''}">
      <div class="when">${when}</div>
      <div class="what">${fam?`<div class="fam">${fam}</div>`:''}${ret?'<span class="muted">退職予定</span>':''}${s.events.map(chipEv).join('')}${s.goals.map(chipGoal).join('')}<button class="add" onclick="editEvent(null,${yr},'me',${qMonth(s.q)})" aria-label="${yr}年${qLabel(s.q)}にイベントを追加">＋</button></div>
    </li>`;
  });
  return out + `</ol>`;
}
const qLabel = q => q===0 ? '' : q==='u' ? '月未定' : `${q*3-2}〜${q*3}月`;
const qMonth = q => (q===0 || q==='u') ? "''" : q*3-2;
function tlSlots(){
  const p=P(), a0=nowAge(), out=[];
  for(let a=a0; a<=p.lifespan; a++){
    const yr=yOf(a), evs=allEvents().filter(e=>e.year===yr), gs=S.goals.filter(g=>g.age===a);
    if(tlOnlyFilled && !(evs.length+gs.length)) continue;
    out.push({q:0, yr, a, events:evs, goals:gs, first:true, now:a===a0});
  }
  return out;
}
function vFamilyTable(){
  const p=P(), a0=nowAge(), ppl=people();
  const future = e => e.year>=Y;
  const sums = ppl.map(m=>{
    const evs=allEvents().filter(e=>(e.who||'me')===m.id && future(e));
    const need=evs.filter(e=>e.amt&&e.dir!=='in').reduce((s,e)=>s+num(e.amt),0)
      + (m.id==='me' ? S.goals.filter(g=>!g.done&&num(g.cost)>0&&yOf(g.age)>=Y).reduce((s,g)=>s+num(g.cost),0) : 0);
    return {m, n:evs.length, need};
  });
  const total = sums.reduce((s,x)=>s+x.need,0);
  let out = `<div class="per-sum">${sums.map(x=>`<div><b>${h(x.m.name)}</b><small>これからの予定 ${x.n}件</small><small>必要資金 ${x.need?fm(x.need):'―'}</small></div>`).join('')}
    <div style="border-color:var(--accent)"><b>家族の合計</b><small>必要資金</small><b>${fm(total)}</b></div></div>`;
  if(!p.family.length){
    out += `<div class="empty-note" style="margin-top:12px">家族を登録すると、ここに列が増えます。<br><button class="btn" onclick="editFamily()">家族を追加</button></div>`;
  }
  const cols = ppl.length + 2;
  out += `<div class="ftable-box"><table class="ft"><thead><tr><th class="stick">年</th>${ppl.map(m=>`<th>${h(m.name)}<small>${fmtBirth(m)}</small></th>`).join('')}<th>必要資金<small>その年の出入り</small></th></tr></thead><tbody>`;
  let lastDec = null, noted = false;
  tlSlots().forEach(s=>{
    const {yr,a}=s, filled=s.events.length+s.goals.length>0;
    const d0=Math.floor(rowAge(meP(),yr)/10)*10;
    if(d0!==lastDec){ out += `<tr class="decrow"><td colspan="${cols}">わたし ${d0}代</td></tr>`; lastDec=d0; }
    let need=0, inc=0;
    s.events.forEach(e=>{ if(e.amt){ if(e.dir==='in') inc+=num(e.amt); else need+=num(e.amt); } });
    s.goals.forEach(g=>{ if(!g.done) need+=num(g.cost); });
    const head = s.q===0 ? `<b>${yr}</b>` : `${s.first?`<b>${yr}</b>`:''}<span class="ql">${qLabel(s.q)}</span>`;
    out += `<tr class="${s.now?'now':''} ${filled?'':'empty'} ${s.first&&s.q!==0?'ystart':''} ${s.past?'past':''}"><th class="stick" scope="row">${head}</th>`;
    ppl.forEach(m=>{
      const fa=famAge(m,yr), age = fa===null ? -1 : fa, born = yr===bparts(m).y;
      const mine=s.events.filter(e=>(e.who||'me')===m.id);
      const chips=mine.map(chipEvT).join('') + (m.id==='me'?s.goals.map(chipGoal).join(''):'');
      const ageTxt = (age<0 || !s.first) ? '' : `<span class="fa${born?' born':''}">${born?'誕生':age+'歳'}</span>`;
      out += `<td>${ageTxt}${chips}${age>=0?`<button class="cadd" onclick="editEvent(null,${yr},'${m.id}',${qMonth(s.q)})" aria-label="${h(m.name)}の${yr}年${qLabel(s.q)}にイベントを追加">＋</button>`:''}</td>`;
    });
    out += `<td class="need">${need?`<span class="amt out">−${fm(need)}</span>`:''}${inc?`<br><span class="amt in">+${fm(inc)}</span>`:''}</td></tr>`;
  });
  out += `</tbody></table></div>
    <p class="muted" style="margin-top:8px">年齢はその年の誕生日を迎えたあとの年齢です。マスの「＋」から、その人のイベントを追加できます。</p>`;
  return out;
}
function chipEvT(e){
  const c = CATS[e.cat]||CATS.other;
  return `<button class="chip" style="--c:${c.c}" onclick="editEvent('${e.id}')">${monthTag(e)}<span>${h(e.title)}</span>${e.amt?`<span class="amt ${e.dir==='in'?'in':'out'}">${e.dir==='in'?'+':'−'}${fm(num(e.amt))}</span>`:''}</button>`;
}
function catOptions(sel){ return Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${v.l}</option>`).join(''); }
function whoOptions(sel){ return people().map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${h(m.name)}</option>`).join(''); }
function evSync(){
  const m=personOf($('#f_who').value), age=Math.round(num($('#f_age').value,NaN));
  $('#f_agel').textContent = `${m.id==='me'?'わたし':m.name}の年齢`;
  if(!isFinite(age)){ $('#f_yr').textContent=''; return; }
  const mo=num($('#f_mo').value)||0, yr=yearFor(m, age, mo), ym=`${yr}年${mo?mo+'月':''}`;
  $('#f_yr').textContent = m.id==='me' ? ym : `${ym}（わたし ${realAge(meP(), yr, mo, 0)}歳）`;
}
function evWhoChange(sel){
  const prev=personOf(sel.dataset.prev), age=num($('#f_age').value,NaN);
  if(isFinite(age)){ const mo=num($('#f_mo').value)||0, yr=yearFor(prev, Math.round(age), mo); $('#f_age').value = realAge(personOf(sel.value), yr, mo, 0); }

}
function editEvent(id, year, who, month){
  if(id && String(id).startsWith('talk:')){ openTalk(String(id).slice(5)); return; }
  const isNew = !id;
  const e = id ? S.events.find(x=>x.id===id) : {id:uid(), who:who||'me', year:year||Y, month:month||'', title:'', cat:'family', dir:'', amt:'', memo:''};
  if(!e) return;
  const m = personOf(e.who||'me');
  openSheet(isNew?'イベントを追加':'イベントを編集', `
    <label class="f" for="f_title">できごと</label>
    <input type="text" id="f_title" value="${h(e.title)}" placeholder="例：大学入学、結婚、家を建てる">
    <div class="two">
      <div><label class="f" for="f_who">だれのイベント</label><select id="f_who" data-prev="${m.id}" onchange="evWhoChange(this)">${whoOptions(m.id)}</select></div>
      <div><label class="f" for="f_cat">分類</label><select id="f_cat">${catOptions(e.cat)}</select></div>
    </div>
    <div class="two">
      <div><label class="f" for="f_age" id="f_agel"></label><input type="number" inputmode="numeric" id="f_age" value="${evAge(m,e)}" oninput="evSync()"></div>
      <div><label class="f" for="f_mo">月（任意）</label><select id="f_mo" onchange="evSync()"><option value="">―</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${num(e.month)===i+1?'selected':''}>${i+1}月</option>`).join('')}</select></div>
    </div>
    <p class="hint" id="f_yr"></p>
    <div class="two">
      <div><label class="f" for="f_dir">必要資金・お金の動き</label><select id="f_dir"><option value="">なし</option><option value="out" ${e.dir==='out'?'selected':''}>必要（出ていく）</option><option value="in" ${e.dir==='in'?'selected':''}>入ってくる</option></select></div>
      <div><label class="f" for="f_amt">金額（万円）</label><input type="number" inputmode="decimal" id="f_amt" value="${h(e.amt)}" placeholder="例：150"></div>
    </div>
    <label class="f" for="f_memo">メモ</label>
    <textarea id="f_memo" placeholder="例：入学金と初年度の授業料、準備は前年から">${h(e.memo)}</textarea>`,
  () => {
    const t=$('#f_title').value.trim(), who=$('#f_who').value, pm=personOf(who), a=Math.round(num($('#f_age').value,NaN));
    if(!t) return 'できごとを入力してください';
    if(!isFinite(a) || a<0) return '年齢を0以上で入力してください';
    const yr=yearFor(pm, a, num($('#f_mo').value)||0);
    if(yr>yOf(P().lifespan)) return `設計図の期間（${yOf(P().lifespan)}年まで）を超えています`;
    const dir=$('#f_dir').value, amt=num($('#f_amt').value);
    if(dir && !(amt>0)) return '金額を入力するか、お金の動きを「なし」にしてください';
    const mo=$('#f_mo').value;
    Object.assign(e, {title:t, who, year:yr, month:mo?+mo:'', cat:$('#f_cat').value, dir, amt:dir?amt:'', memo:$('#f_memo').value});
    if(isNew) S.events.push(e);
    toast(isNew?'イベントを追加しました':'イベントを保存しました');
  }, isNew ? null : () => { S.events = S.events.filter(x=>x.id!==id); toast('イベントを削除しました'); });
  evSync();
}

/* ---------- money ---------- */
function nice(x){ if(!(x>0)) return 100; const m=10**Math.floor(Math.log10(x)), f=x/m; return (f<=1?1:f<=2?2:f<=5?5:10)*m; }
function chart(rows){
  if(rows.length<2) return '<p class="muted">グラフを表示するには、設計図の期間を2年以上にしてください。</p>';
  const W=700,H=300,pl=80,pr=14,pt=20,pb=40;
  const v=rows.map(r=>r.bal); let mx=Math.max(0,...v), mn=Math.min(0,...v); if(mx-mn<1) mx=mn+100;
  const st=nice((mx-mn)/4); mx=Math.ceil(mx/st)*st; mn=Math.floor(mn/st)*st;
  const X=i=>pl+(W-pl-pr)*i/(rows.length-1), Yv=b=>pt+(H-pt-pb)*(mx-b)/(mx-mn), y0=Yv(0);
  const line=rows.map((r,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Yv(r.bal).toFixed(1)}`).join('');
  const area=`${line}L${X(rows.length-1).toFixed(1)},${y0.toFixed(1)}L${X(0).toFixed(1)},${y0.toFixed(1)}Z`;
  let g='';
  for(let k=0; mn+k*st<=mx+1e-9; k++){ const t=mn+k*st, y=Yv(t); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" class="gl${t===0?' zero':''}"/><text x="${pl-8}" y="${y+6}" class="yl">${fmShort(t)}</text>`; }
  rows.forEach((r,i)=>{ const ra=rowAge(meP(),r.yr); if(ra%10===0) g+=`<text x="${X(i)}" y="${H-12}" class="xl">${ra}歳</text>`; });
  const ri=rows.findIndex(r=>r.a===P().retireAge);
  if(ri>=0) g+=`<line x1="${X(ri)}" x2="${X(ri)}" y1="${pt}" y2="${H-pb}" class="rt"/><text x="${X(ri)+6}" y="${pt+14}" class="rtl">退職</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="年齢ごとの貯蓄残高の推移">
    <defs><clipPath id="cpos"><rect x="0" y="0" width="${W}" height="${y0}"/></clipPath><clipPath id="cneg"><rect x="0" y="${y0}" width="${W}" height="${H}"/></clipPath></defs>
    ${g}<path d="${area}" class="ar pos" clip-path="url(#cpos)"/><path d="${area}" class="ar neg" clip-path="url(#cneg)"/>
    <path d="${line}" class="ln pos" clip-path="url(#cpos)"/><path d="${line}" class="ln neg" clip-path="url(#cneg)"/></svg>`;
}
function flowList(kind){
  const list=S.money[kind];
  if(!list.length) return `<p class="muted" style="padding:6px 2px">${kind==='incomes'?'給与や年金など、毎年入ってくるお金を追加します':'生活費や住宅ローンなど、毎年出ていくお金を追加します'}</p>`;
  return `<ul class="flows">${list.map(i=>`<li><button onclick="editFlow('${kind}','${i.id}')"><span class="nm">${h(i.name)}<small>${i.from}歳〜${i.to}歳</small></span><span class="val">${fm(num(i.amount))}／年</span></button></li>`).join('')}</ul>`;
}
function vMoney(){

  const oneOffs=[...S.events.filter(e=>e.amt&&e.year>=Y).map(e=>({a:evAge(meP(),e),mo:e.month,t:(e.who&&e.who!=='me'?personOf(e.who).name+'：':'')+e.title,v:(e.dir==='in'?1:-1)*num(e.amt)})),
                 ...S.goals.filter(g=>!g.done&&num(g.cost)>0).map(g=>({a:g.age,t:'目標：'+g.title,v:-num(g.cost)})),
                 ...(G().toMoney ? [...new Set(G().talks.filter(t=>t.status!=='cancel').flatMap(t=>(t.items||[]).map(it=>itemYear(it,t))))].filter(yr=>yr>=Y).map(yr=>({a:rowAge(meP(),yr),t:`講演の謝礼・交通費（${yr}年）`,v:talkYenByYear(yr)/10000,y:talkYenByYear(yr),talk:true})).filter(o=>o.y) : [])].sort((a,b)=>a.a-b.a||(num(a.mo)||0)-(num(b.mo)||0));
  return `<h1>お金</h1>
  <p class="lead">金額はすべて万円で入力します。年表と目標に入れた金額も、その年の出入りとして計算に入ります。</p>
  <div class="panel" style="margin-top:14px"><div class="inline-fields">

/* ---------- goals ---------- */
function vGoals(){
  const a0=nowAge();
  const gs=S.goals.slice().sort((a,b)=>(a.done-b.done)||(a.age-b.age));
  let out=`<div class="bar" style="margin-top:6px"><p class="lead" style="margin:0">やりたいことを年齢と結びつけて、小さな一歩に分けておきます。</p><button class="btn small" onclick="editGoal()">＋ 目標</button></div>`;
  if(!gs.length) return out + `<div class="empty-note" style="margin-top:16px">まだ目標がありません。<br>「いつか」を「何歳で」に置きかえてみましょう。<br><button class="btn" onclick="editGoal()">最初の目標を書く</button></div>`;
  out += `<div class="goals" style="margin-top:16px">`;
  gs.forEach(g=>{
    const c=CATS[g.cat]||CATS.other, sd=g.steps.filter(s=>s.done).length, left=g.age-a0;
    out += `<article class="goal-card ${g.done?'done':''}">
      <div class="gh">
        <button class="check" onclick="toggleGoal('${g.id}')" aria-label="${g.done?'未達成に戻す':'達成にする'}" aria-pressed="${!!g.done}">✓</button>
        <div><h3>${h(g.title)}</h3><p class="gmeta">${g.age}歳まで（${g.done?'達成済み':left>0?'あと'+left+'年':left===0?'今年':left*-1+'年前'}）　${c.l}${num(g.cost)>0?`　必要資金 ${fm(num(g.cost))}`:''}</p></div>
        <button class="edit" onclick="editGoal('${g.id}')">編集</button>
      </div>
      ${g.why?`<p class="why">${h(g.why)}</p>`:''}
      ${g.steps.length?`<div class="progress" style="margin-top:12px"><div style="width:${sd/g.steps.length*100}%"></div></div><p class="muted" style="font-size:.78rem;margin-top:2px">ステップ ${sd} / ${g.steps.length}</p>`:''}
      <ul class="steps">${g.steps.map(s=>`<li><label><input type="checkbox" ${s.done?'checked':''} onchange="toggleStep('${g.id}','${s.id}')"><span class="${s.done?'fin':''}">${h(s.text)}</span></label><button class="x" onclick="delStep('${g.id}','${s.id}')" aria-label="ステップを削除">×</button></li>`).join('')}</ul>
      ${g.done?'':`<div class="addstep"><input type="text" id="st_${g.id}" placeholder="次の一歩を追加" onkeydown="if(event.key==='Enter'&&!event.isComposing)addStep('${g.id}')"><button class="btn ghost small" onclick="addStep('${g.id}')">追加</button></div>`}
    </article>`;
  });
  return out + `</div>`;
}
function findGoal(id){ return S.goals.find(g=>g.id===id); }
function toggleGoal(id){ const g=findGoal(id); if(!g) return; g.done=!g.done; save(); render(); toast(g.done?'達成おめでとうございます':'未達成に戻しました'); }
function toggleStep(gid,sid){ const g=findGoal(gid); const s=g&&g.steps.find(x=>x.id===sid); if(!s) return; s.done=!s.done; save(); render(); }
function delStep(gid,sid){ const g=findGoal(gid); if(!g) return; g.steps=g.steps.filter(x=>x.id!==sid); save(); render(); }
function addStep(gid){
  const g=findGoal(gid), el=$('#st_'+gid); if(!g||!el) return;
  const t=el.value.trim(); if(!t){ el.focus(); return; }
  g.steps.push({id:uid(),text:t,done:false}); save(); render();
  const n=$('#st_'+gid); if(n) n.focus();
}
function editGoal(id){
  const isNew=!id, a0=Math.max(0,nowAge());
  const g = id ? findGoal(id) : {id:uid(), title:'', age:a0+5, cat:'play', cost:'', why:'', done:false, steps:[]};

  openSheet(isNew?'目標を追加':'目標を編集', `
    <label class="f" for="f_title">やりたいこと</label>
    <input type="text" id="f_title" value="${h(g.title)}" placeholder="例：フルマラソンを走る、店を開く">

      <div><label class="f" for="f_cat">分類</label><select id="f_cat">${catOptions(g.cat)}</select></div>
    </div>

    <input type="number" inputmode="decimal" id="f_cost" value="${h(g.cost)}" placeholder="入れると、その年の支出として計算します">
    <label class="f" for="f_why">なぜやりたいか</label>

  () => {

    if(isNew) S.goals.push(g);
    toast(isNew?'目標を追加しました':'目標を保存しました');

}

/* ---------- growth（成長：外部講演） ---------- */
let growthSub='talks', talkView=null;
const pad2 = n => String(n).padStart(2,'0');
const todayStr = () => `${Y}-${pad2(M)}-${pad2(TD)}`;
const G = () => S.growth;
const TALK_FORMATS=['講演','基調講演','パネルディスカッション','ワークショップ','勉強会・LT','講義','その他'];
const VENUE_TYPES={venue:'会場',online:'オンライン',hybrid:'ハイブリッド'};
const TALK_STATUS={plan:'計画中',done:'実施済み',cancel:'中止'};
const ASPECTS=[['structure','構成'],['speech','話し方'],['time','時間配分'],['qa','質疑対応']];
const MKINDS={fee:{l:'謝礼',dir:'in'},travelIn:{l:'交通費（支給）',dir:'in'},travel:{l:'交通費（実費）',dir:'out'},lodging:{l:'宿泊費',dir:'out'},otherIn:{l:'その他の収入',dir:'in'},otherOut:{l:'その他の支出',dir:'out'}};
const yen = v => (v<0?'−':'') + Math.abs(Math.round(v)).toLocaleString('ja-JP') + '円';
const numOr = v => { const n=parseFloat(v); return isFinite(n)?n:''; };
const stars = v => v ? '★'.repeat(+v)+'☆'.repeat(5-v) : '―';
const f1 = v => v==null ? '―' : v.toFixed(1);
function avg(a){ a=a.filter(v=>v!==''&&v!=null&&isFinite(+v)).map(Number); return a.length? a.reduce((s,v)=>s+v,0)/a.length : null; }
function fmtDate(d){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||''); if(!m) return d||''; const w='日月火水木金土'[new Date(+m[1],+m[2]-1,+m[3]).getDay()]; return `${+m[1]}年${+m[2]}月${+m[3]}日（${w}）`; }
function itemNet(it){ const k=MKINDS[it.kind]||MKINDS.otherOut; const a=num(it.amount)-(it.kind==='fee'?num(it.tax):0); return k.dir==='in'?a:-a; }
function itemYear(it,t){ return num(String(it.date||t.date||'').slice(0,4)); }
function talkNet(t){ return (t.items||[]).reduce((s,it)=>s+itemNet(it),0); }
function talkYear(t){ return num(String(t.date||'').slice(0,4)) || Y; }
function talkMonth(t){ return num(String(t.date||'').slice(5,7)) || ''; }
function talkLabel(t){ return t.title || t.event || '（無題の講演）'; }
const talksSorted = () => G().talks.slice().sort((a,b)=>String(a.date||'9999').localeCompare(String(b.date||'9999')));
const doneTalks = () => talksSorted().filter(t=>t.status==='done');
function talkVirtualEvents(){
  if(!S || !S.growth || !G().showOnTimeline) return [];
  return G().talks.filter(t=>t.status!=='cancel' && t.date).map(t=>({id:'talk:'+t.id, who:'me', year:talkYear(t), month:talkMonth(t), title:'講演：'+talkLabel(t), cat:'work', dir:'', amt:'', memo:'', talk:true}));
}
const allEvents = () => S.events.concat(talkVirtualEvents()).sort(evSort);
function talkYenByYear(yr){
  return G().talks.filter(t=>t.status!=='cancel').reduce((s,t)=>s+(t.items||[]).filter(it=>itemYear(it,t)===yr).reduce((a,it)=>a+itemNet(it),0),0);
}
const talkMoneyByYear = yr => G().toMoney ? talkYenByYear(yr)/10000 : 0;   // 万円

function goGrowth(sub){ tab='growth'; growthSub=sub; talkView=null; render(); window.scrollTo(0,0); }
function openTalk(id){ tab='growth'; growthSub='talks'; talkView=id; render(); window.scrollTo(0,0); }
function vGrowth(){
  if(growthSub==='talks' && talkView){ const t=G().talks.find(x=>x.id===talkView); if(t) return vTalkDetail(t); talkView=null; }
  const out=`<h1>成長</h1>
  <div class="seg" role="group" aria-label="表示の切り替え">
    <button aria-pressed="${growthSub==='talks'}" onclick="goGrowth('talks')">外部講演</button>
    <button aria-pressed="${growthSub==='goals'}" onclick="goGrowth('goals')">目標</button>

  if(growthSub==='goals') return out + vGoals();
  if(growthSub==='skills') return out + `<div class="empty-note" style="margin-top:12px">スキルアップの計画と実績は、次の段階で追加します。<br>資格・研修・読書などを、講演と同じく「計画 → 実績 → 振り返り」で記録できるようにする予定です。</div>`;
  return out + vTalks();
}
function vTalks(){
  const g=G(), all=talksSorted(), done=all.filter(t=>t.status==='done'), today=todayStr();
  const plans=all.filter(t=>t.status==='plan');
  const pending=plans.filter(t=>t.date && t.date<today);
  const cancels=all.filter(t=>t.status==='cancel');
  const thisYear=done.filter(t=>talkYear(t)===Y);
  const aud=done.reduce((s,t)=>s+num(t.audience),0);
  const yearNet=talkYenByYear(Y);
  const target=num(g.yearTarget);
  const k=Math.min(3, Math.floor(done.length/2)), early=done.slice(0,k), recent=done.slice(-k);
  let out=`<div class="bar" style="margin-top:6px"><p class="lead" style="margin:0">講演の計画と実績を記録し、回を重ねるごとの変化を見ます。</p><button class="btn small" onclick="editTalkPlan()">＋ 講演</button></div>
  <div class="stats">
    <div><small>今年の実施</small><b>${thisYear.length}回${target?`<span class="muted" style="font-weight:400"> / 目標${target}回</span>`:''}</b>${target?`<div class="progress"><div style="width:${Math.min(100,thisYear.length/target*100)}%"></div></div>`:''}</div>
    <div><small>累計の実施</small><b>${done.length}回</b><small>延べ聴講者 約${aud.toLocaleString('ja-JP')}人</small></div>
    <div><small>自己評価の平均</small><b>${f1(avg(done.map(t=>t.selfScore)))}</b>${k?`<small>最初${k}回 ${f1(avg(early.map(t=>t.selfScore)))} → 直近${k}回 ${f1(avg(recent.map(t=>t.selfScore)))}</small>`:''}</div>
    <div><small>今年の講演収支</small><b class="${yearNet<0?'warn':''}">${yen(yearNet)}</b><small>謝礼 − 交通費など</small></div>
  </div>`;
  if(pending.length) out+=`<div class="notice">実績がまだの講演が${pending.length}件あります。${pending.map(t=>`<br><button class="link" onclick="editTalkResult('${t.id}')">${h(fmtDate(t.date))}　${h(talkLabel(t))}</button>`).join('')}</div>`;
  out+=`<h2>成長の推移</h2>${growthChart(done)}${aspectCompare(done)}${improveRate(done)}`;
  out+=`<h2>これからの講演</h2>`;
  out+= plans.length ? `<div class="tlist">${plans.map(talkCard).join('')}</div>` : `<div class="empty-note">予定している講演はありません。<br><button class="btn" onclick="editTalkPlan()">講演の計画を登録</button></div>`;
  if(done.length) out+=`<h2>実施した講演</h2><div class="tlist">${done.slice().reverse().map(talkCard).join('')}</div>`;
  if(cancels.length) out+=`<details style="margin-top:14px"><summary>中止になった講演（${cancels.length}件）</summary><div class="tlist">${cancels.map(talkCard).join('')}</div></details>`;

function talkCard(t){
  const past = t.status==='plan' && t.date && t.date<todayStr();
  const badge = t.status==='done' ? '<span class="badge done">実施済み</span>' : t.status==='cancel' ? '<span class="badge">中止</span>' : past ? '<span class="badge warn">実績未入力</span>' : '<span class="badge plan">計画中</span>';
  const meta=[t.title&&t.event?h(t.event):'', t.place?h(t.place):'', t.venueType&&t.venueType!=='venue'?VENUE_TYPES[t.venueType]:'', t.audience?`約${num(t.audience)}人`:''].filter(Boolean).join('　');
  return `<button class="tcard" onclick="openTalk('${t.id}')">
    <span class="tdate">${t.date?h(fmtDate(t.date)):'日付未定'}${badge}</span>
    <b>${h(talkLabel(t))}</b>
    ${meta?`<span class="tmeta">${meta}</span>`:''}
    ${t.status==='done'?`<span class="tscore"><span class="star">${stars(t.selfScore)}</span>　反応 ${t.reaction||'―'}　緊張 ${t.tension||'―'}${(t.items||[]).length?`　収支 ${yen(talkNet(t))}`:''}</span>`:''}
  </button>`;
}
function growthChart(done){
  const pts=done.filter(t=>t.selfScore||t.reaction||t.tension);
  if(pts.length<2) return `<div class="panel"><p class="muted">実施済みの講演が2件以上たまると、自己評価・反応・緊張度の推移をグラフで表示します。</p></div>`;
  const W=700,H=270,pl=44,pr=20,pt=16,pb=40,n=pts.length;
  const X=i=>pl+(W-pl-pr)*i/(n-1), Yv=v=>pt+(H-pt-pb)*(5-v)/4;
  const series=[['selfScore','自己評価','var(--accent)'],['reaction','聴講者の反応','var(--green)'],['tension','緊張度','#E07B2E']];
  let g='';
  for(let v=1;v<=5;v++) g+=`<line x1="${pl}" x2="${W-pr}" y1="${Yv(v)}" y2="${Yv(v)}" class="gl"/><text x="${pl-12}" y="${Yv(v)+6}" class="yl">${v}</text>`;
  const step=Math.ceil(n/7);
  pts.forEach((t,i)=>{ if(i%step===0||i===n-1){ const m=/^(\d{4})-(\d{2})/.exec(t.date||''); g+=`<text x="${X(i)}" y="${H-12}" class="xl">${m?m[1].slice(2)+'/'+(+m[2]):i+1}</text>`; }});
  const ma=pts.map((t,i)=>avg(pts.slice(Math.max(0,i-2),i+1).map(x=>x.selfScore)));
  const mp=ma.map((v,i)=>v==null?null:`${X(i).toFixed(1)},${Yv(v).toFixed(1)}`).filter(Boolean);
  if(mp.length>1) g+=`<path d="M${mp.join('L')}" class="ma"/>`;
  series.forEach(([k,l,c])=>{
    const ps=pts.map((t,i)=>t[k]?[X(i),Yv(+t[k])]:null);
    let d='', pen=false; ps.forEach(p=>{ if(!p){pen=false;return;} d+=(pen?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1); pen=true; });
    if(d) g+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>`;
    ps.forEach((p,i)=>{ if(p) g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5.5" fill="${c}" stroke="var(--card)" stroke-width="2"><title>${h(fmtDate(pts[i].date)+'　'+l+' '+pts[i][k])}</title></circle>`; });
  });
  return `<div class="panel"><div class="legend" style="margin-bottom:6px">${series.map(([k,l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')}<span><i style="background:var(--accent);opacity:.25"></i>自己評価（直近3回の平均）</span></div>
  <div class="chart-box"><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="講演ごとの自己評価・反応・緊張度の推移">${g}</svg></div>
  <p class="muted" style="font-size:.8rem;margin-top:4px">緊張度は低いほど落ち着いて話せたことを表します。</p></div>`;

function aspectCompare(done){

function compressImage(file, max=1400, q=0.72){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const s=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('写真を読み込めませんでした')); };
    img.src=url;
  });
}
async function rcPick(inp){
  const f=inp.files[0]; inp.value=''; if(!f) return;
  const msg=$('#rc_msg');
  try{
    msg.textContent='写真を準備しています…';
    rcPending=await compressImage(f); showRc(rcPending); msg.textContent='';
    if(aiKey()) rcRead(); else msg.textContent='設定でAIのAPIキーを登録すると、金額や日付を自動で読み取れます。';
  }catch(e){ msg.textContent=e.message; }
}
const AI_KEY='jinsei-sekkeizu-ai-key', AI_MODEL='jinsei-sekkeizu-ai-model', AI_DEFAULT_MODEL='claude-haiku-5-5';
const aiKey=()=>{ try{ return localStorage.getItem(AI_KEY)||''; }catch(e){ return ''; } };
const aiModel=()=>{ try{ return localStorage.getItem(AI_MODEL)||AI_DEFAULT_MODEL; }catch(e){ return AI_DEFAULT_MODEL; } };
async function rcRead(){
  const d=rcPending||rcCurrent, msg=$('#rc_msg'), btn=$('#rc_ai');
  if(!msg) return;
  if(!d){ msg.textContent='先に領収証の写真を撮影してください'; return; }
  if(!aiKey()){ msg.textContent='設定でAIのAPIキーを登録してください'; return; }
  msg.textContent='AIで読み取っています…'; if(btn) btn.disabled=true;
  try{
    const r=await ocrReceipt(d);
    if(!$('#m_amt')) return;
    const filled=[];
    if(r.kind && MKINDS[r.kind]){ $('#m_kind').value=r.kind; $('#m_taxw').hidden=r.kind!=='fee'; }
    if(r.amount>0){ $('#m_amt').value=Math.round(r.amount); filled.push('金額'); }
    if(/^\d{4}-\d{2}-\d{2}$/.test(r.date)){ $('#m_date').value=r.date; filled.push('日付'); }
    if(r.payee){ $('#m_payee').value=r.payee; filled.push('支払先'); }
    if(r.memo){ $('#m_memo').value=r.memo; filled.push('内容'); }
    if(r.kind==='fee' && r.tax>0) $('#m_tax').value=Math.round(r.tax);
    msg.textContent = filled.length ? `${filled.join('・')}を読み取りました。内容を確かめてから保存してください。` : '読み取れる項目がありませんでした。手で入力してください。';
  }catch(e){ const m=$('#rc_msg'); if(m) m.textContent=e.message; }
  finally{ if(btn) btn.disabled=false; }
}
async function ocrReceipt(dataUrl){
  const b64=dataUrl.split(',')[1];
  const prompt=`この画像は日本の領収証・レシート・交通機関の利用票・謝金の支払明細のいずれかです。読み取った内容を、次の形のJSONだけで返してください。説明文は不要です。
{"date":"YYYY-MM-DD（読めなければnull）","amount":税込の合計金額（円・整数。読めなければnull）,"payee":"発行者や店名（読めなければnull）","kind":"travel・lodging・fee・otherOut のいずれか（交通機関はtravel、宿泊はlodging、謝金・謝礼の支払明細はfee、それ以外はotherOut）","tax":源泉徴収税額（謝礼の明細に記載があれば整数、なければnull）,"memo":"内容の短い要約（例：新幹線 東京→仙台）"}
和暦は西暦に直してください。`;
  let res;
  try{
    res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':aiKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:aiModel(), max_tokens:600, messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:prompt}]}]})});
  }catch(e){ throw new Error('AIに接続できませんでした。通信を確認してください。'); }
  if(!res.ok){
    let m=''; try{ m=(await res.json()).error.message; }catch(e){}
    if(res.status===401) throw new Error('APIキーが正しくありません。設定を確認してください。');
    if(res.status===404) throw new Error('AIのモデル名が見つかりません。設定のモデル名を確認してください。');
    if(res.status===429||res.status===529) throw new Error('AIが混み合っています。少し待ってからもう一度お試しください。');
    throw new Error('読み取りに失敗しました（'+res.status+(m?'：'+m:'')+'）');
  }
  const j=await res.json();
  const text=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
  const mm=text.match(/\{[\s\S]*\}/); if(!mm) throw new Error('読み取り結果を解釈できませんでした');
  let o; try{ o=JSON.parse(mm[0]); }catch(e){ throw new Error('読み取り結果を解釈できませんでした'); }
  return {date:o.date||'', amount:num(o.amount), payee:o.payee||'', memo:o.memo||'', kind:o.kind||'', tax:num(o.tax)};
}
function setGrowth(k,v){
  const g=G();
  if(k==='yearTarget'){ const n=Math.round(num(v,NaN)); g.yearTarget = n>0 ? n : ''; }
  else g[k]=!!v;
  save(); render(); toast('保存しました');
}
function setAi(k,v){ try{ v=String(v).trim(); if(v) localStorage.setItem(k,v); else localStorage.removeItem(k); }catch(e){} render(); toast('この端末に保存しました'); }

function setProf(k,v){
  const p=P();
  if(k==='name'){ p.name=v.trim(); save(); toast('保存しました'); return; }
  if(k==='birthDate'){
    const d=parseDate(v);
    if(!d || d.y>Y){ toast('生年月日を入力してください'); render(); return; }
    if(!(p.lifespan > Y-d.y)){ toast('設計図の年齢を見直してください'); render(); return; }
    p.birthDate=v; p.birthYear=d.y; save(); render(); toast('保存しました'); return;
  }
  const n=Math.round(num(v,NaN));
  if(k==='birthYear' && !(n>1900&&n<=Y)){ toast('生まれた年を西暦4桁で入力してください'); render(); return; }
  if(k==='lifespan' && !(n>Y-p.birthYear && n<=120)){ toast(`${Y-p.birthYear+1}〜120 の範囲で入力してください`); render(); return; }
  if(k==='retireAge' && !(n>0&&n<=120)){ toast('退職予定の年齢を入力してください'); render(); return; }
  p[k]=n; save(); render(); toast('保存しました');
}
const PRESETS = [
  {l:'小学校入学', n:7,  e:6,  cat:'learn', mo:4},
  {l:'中学校入学', n:13, e:12, cat:'learn', mo:4},
  {l:'高校入学',   n:16, e:15, cat:'learn', mo:4},
  {l:'大学入学',   n:19, e:18, cat:'learn', mo:4},
  {l:'就職',       n:23, e:22, cat:'work', mo:4},
  {l:'還暦',       n:60, e:60, cat:'family'},
  {l:'古希',       n:70, e:70, cat:'family'},
  {l:'喜寿',       n:77, e:77, cat:'family'},
  {l:'米寿',       n:88, e:88, cat:'family'}
];
let presetRows = [];
function renderPresets(fid){
  const box=$('#f_presets'); if(!box) return;
  const bd=parseDate($('#f_bd').value), f=P().family.find(x=>x.id===fid);
  const by = bd ? bd.y : (f ? num(f.birthYear) : NaN), bm = bd ? bd.m : (f ? num(f.birthMonth) : 0), bday = bd ? bd.d : 2;
  if(!(by>1900&&by<=Y+30)){ box.innerHTML='<p class="muted">生年月日を入れると、候補が表示されます。</p>'; presetRows=[]; return; }
  const early = (bm>=1 && bm<=3) || (bm===4 && bday===1), end=yOf(P().lifespan);
  const have = new Set(S.events.filter(e=>e.who===fid).map(e=>e.title));
  presetRows = PRESETS.map(x=>({...x, year: by + (early?x.e:x.n), month: x.mo || (bm>=1&&bm<=12?bm:'')})).filter(x=>x.year>=Y && x.year<=end && !have.has(x.l));
  if(!presetRows.length){ box.innerHTML='<p class="muted">追加できる候補はありません。</p>'; return; }
  box.innerHTML = `<ul class="presets">${presetRows.map((x,i)=>`<li><label><input type="checkbox" id="pr_${i}">${x.l}<small>${x.year}年${x.month?x.month+'月':''}</small></label><input type="number" inputmode="decimal" id="pa_${i}" placeholder="必要資金 万円" aria-label="${x.l}の必要資金（万円）"></li>`).join('')}</ul>
`;
}
function editFamily(id){
  const isNew=!id, f = id ? P().family.find(x=>x.id===id) : {id:uid(), name:'', birthYear:'', birthMonth:'', birthDate:''};
  if(!f) return;
  const cnt = S.events.filter(e=>e.who===f.id).length;
  openSheet(isNew?'家族を追加':'家族を編集', `
    <label class="f" for="f_name">呼び方</label>
    <input type="text" id="f_name" value="${h(f.name)}" placeholder="例：パートナー、長男、母">
    <div class="two">
    </div>
    <label class="f" for="f_bd">生年月日</label>
    <input type="date" id="f_bd" value="${h(f.birthDate||'')}" max="${Y+30}-12-31" onchange="renderPresets('${f.id}')" oninput="renderPresets('${f.id}')">
    ${!f.birthDate && f.birthYear ? `<p class="hint">いまは ${f.birthYear}年生まれ として登録されています</p>`:''}
    <label class="f">定番のライフイベントをまとめて追加</label>
    <div id="f_presets"></div>`,
  () => {
    const n=$('#f_name').value.trim(), bdv=$('#f_bd').value, bd=parseDate(bdv);
    if(!n) return '呼び方を入力してください';
    if(bd){ if(bd.y>Y+30) return '生年月日を確認してください'; Object.assign(f,{name:n,birthYear:bd.y,birthMonth:bd.m,birthDate:bdv}); }
    else if(!isNew && f.birthYear){ f.name=n; }
    else return '生年月日を入力してください';
    if(isNew) P().family.push(f);
    let added=0;
    presetRows.forEach((x,i)=>{
      const cb=$('#pr_'+i); if(!cb||!cb.checked) return;
      const amt=num($('#pa_'+i).value);
      S.events.push({id:uid(), who:f.id, year:x.year, month:x.month, title:x.l, cat:x.cat, dir:amt>0?'out':'', amt:amt>0?amt:'', memo:''});
      added++;
    });
    toast(added?`家族を保存し、イベントを${added}件追加しました`:'家族を保存しました');
  }, isNew ? null : () => { P().family=P().family.filter(x=>x.id!==id); S.events=S.events.filter(e=>e.who!==id); toast('削除しました'); },
  cnt ? `${f.name}さんと、そのイベント${cnt}件を削除します。よろしいですか？` : null);
  renderPresets(f.id);
}
function exportJSON(){
  try{
    const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download=`jinsei-sekkeizu-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }catch(e){ toast('書き出せませんでした。「データをコピー」を使ってください'); }
}
function copyJSON(){
  if(!navigator.clipboard){ toast('この環境ではコピーできません'); return; }
  navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('データをコピーしました'),()=>toast('コピーできませんでした'));
}
function applyImport(text){
  let d; try{ d=JSON.parse(text); }catch(e){ return 'データの形式が正しくありません'; }
  if(!d || !d.profile || !d.profile.birthYear) return '人生設計図のデータではないようです';
  if(S && !confirm('いまのデータを読み込んだデータで置きかえます。よろしいですか？')) return '';
  S=normalize(d); save(); tab='home'; render(); toast('データを読み込みました'); return null;
}
function importFile(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ const e=applyImport(r.result); if(e) toast(e); };
  r.readAsText(f); inp.value='';
}
function importPaste(){
  openSheet('貼り付けて読み込む', `<label class="f" for="f_json">コピーしたデータ</label><textarea id="f_json" style="min-height:160px" placeholder="ここに貼り付け"></textarea>`,
    () => { const e=applyImport($('#f_json').value.trim()); if(e===null) return; return e || 'KEEP'; }, null);
}
function clearAll(){
  if(!confirm('クラウド上のすべてのデータを消します。ほかの端末からも消え、元に戻せません。よろしいですか？')) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  S=null; save(); if(fbDb) fbDb.ref(DB_ROOT+'/receipts').remove().catch(()=>{});
  tab='home'; render(); window.scrollTo(0,0);
}

/* ---------- sheet ---------- */
let sheetSave=null, sheetDel=null, sheetDelMsg=null, lastFocus=null;
function openSheet(title, body, onSave, onDel, delMsg){
  sheetDelMsg=delMsg||null;
  lastFocus=document.activeElement;
  $('#sheetTitle').textContent=title; $('#sheetBody').innerHTML=body; $('#sheetErr').textContent='';
  sheetSave=onSave; sheetDel=onDel; $('#sheetDel').hidden=!onDel; $('#sheetSave').hidden=!onSave; $('#sheet').hidden=false;
  document.body.style.overflow='hidden';
}
function closeSheet(){
  $('#sheet').hidden=true; document.body.style.overflow='';
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function sheetSaveRun(){
  if(!sheetSave) return;
  const err=sheetSave();
  if(err==='KEEP') return;
  if(err){ $('#sheetErr').textContent=err; return; }
  if(S) save(); closeSheet(); render();
}
function sheetDelete(){
  if(!sheetDel || !confirm(sheetDelMsg||'削除しますか？')) return;
  sheetDel(); save(); closeSheet(); render();
}
$('#sheet').addEventListener('click', e => { if(e.target.id==='sheet') closeSheet(); });
document.addEventListener('keydown', e => { if(e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });

if('serviceWorker' in navigator && location.protocol==='https:' && !location.hostname.endsWith('claude.ai')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
render();
initFirebase();
