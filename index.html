<title>人生設計図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F3F6FA; --grid:rgba(46,111,216,.075); --ink:#1E3350; --sub:#5B6B82; --line:#CBD7E6;
  --card:#FFFFFF; --accent:#2E6FD8; --accent-soft:#E3ECFA; --gold:#C98A17; --gold-soft:#FBF0D9;
  --green:#2F8F66; --red:#C94A3D; --red-soft:#FBE7E4; --shadow:0 1px 0 rgba(30,51,80,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1A2B; --grid:rgba(120,170,240,.08); --ink:#E4ECF7; --sub:#93A4BC; --line:#2A3C57;
    --card:#16243A; --accent:#6FA3F2; --accent-soft:#1D3354; --gold:#E9B24E; --gold-soft:#3A2F17;
    --green:#5CC08E; --red:#EE7B6D; --red-soft:#43221F; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1A2B; --grid:rgba(120,170,240,.08); --ink:#E4ECF7; --sub:#93A4BC; --line:#2A3C57;
  --card:#16243A; --accent:#6FA3F2; --accent-soft:#1D3354; --gold:#E9B24E; --gold-soft:#3A2F17;
  --green:#5CC08E; --red:#EE7B6D; --red-soft:#43221F; --shadow:none; color-scheme:dark;
}
html{background:var(--paper);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:1.75rem;font-weight:900;letter-spacing:.02em;line-height:1.3;margin:8px 0 4px}
h2{font-size:1.05rem;font-weight:700;margin:32px 0 10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;border-top:1.5px dashed var(--line)}
h3{font-size:1.05rem;margin:0;line-height:1.45}
p{margin:0}
.lead{color:var(--sub)}
.muted{color:var(--sub);font-size:.9rem}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.btn{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;min-height:44px}
:root[data-theme="dark"] .btn{color:#0F1A2B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0F1A2B}}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{padding:6px 14px;min-height:36px;font-size:.9rem}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---- ruler (hero) ---- */
.ruler-box{margin:18px -6px 4px;overflow-x:auto}
.ruler{display:block;width:100%;min-width:320px;height:auto}
.ruler .tk{stroke:var(--sub);stroke-width:1.5}
.ruler .tk.big{stroke:var(--ink);stroke-width:2.5}
.ruler .tl{fill:var(--sub);font-size:26px;text-anchor:middle;font-weight:500}
.ruler .ax-past{stroke:var(--accent);stroke-width:8;stroke-linecap:round}
.ruler .ax-fut{stroke:var(--accent);stroke-width:4;stroke-dasharray:10 8;opacity:.55}
.ruler .ret{stroke:var(--sub);stroke-width:2;stroke-dasharray:4 5}
.ruler .retl{fill:var(--sub);font-size:22px}
.ruler .now line{stroke:var(--accent);stroke-width:2.5}
.ruler .now rect{fill:var(--accent)}
.ruler .now text{fill:var(--paper);font-size:26px;font-weight:700;text-anchor:middle}
.ruler .gm{fill:var(--gold);stroke:var(--gold);stroke-width:3}
.ruler .gm.open{fill:var(--card)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--sub);margin:0 0 4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend i.dia{border-radius:1px;transform:rotate(45deg);background:var(--gold)}

.facts{padding:0}
.fact{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.fact:first-child{border-top:0}
.fact .k{color:var(--sub);font-size:.9rem;flex-shrink:0}
.fact .v{text-align:right;font-weight:700}
.fact .v small{display:block;font-weight:400;color:var(--sub);font-size:.8rem}
.warn{color:var(--red)}
.progress{height:8px;background:var(--accent-soft);border-radius:99px;overflow:hidden;margin-top:6px;min-width:120px}
.progress>div{height:100%;background:var(--gold);border-radius:99px}

.soon{list-style:none;margin:0;padding:0}
.soon li{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:center}
.soon .yrs{font-weight:900;color:var(--accent);font-size:.95rem}
.soon .yrs small{display:block;font-weight:400;color:var(--sub);font-size:.75rem}

/* ---- timeline ---- */
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--sub);margin:4px 0 12px;min-height:40px}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
.tl{list-style:none;margin:0;padding:0}
.tl .dec{font-weight:900;font-size:1.3rem;margin:22px 0 4px;display:flex;align-items:center;gap:10px}
.tl .dec::after{content:"";flex:1;border-top:2px solid var(--ink);opacity:.15}
.yr{display:grid;grid-template-columns:74px 1fr;min-height:32px}
.yr .when{text-align:right;padding:6px 12px 6px 0;border-right:2px solid var(--line);line-height:1.2}

.yr.empty .when span{display:none}
.yr.now .when{border-right-color:var(--accent)}
.yr.now .when b{color:var(--accent)}
.yr.ret .when{border-right-style:dashed}
.yr .what{padding:4px 0 4px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.yr .when em{display:block;font-style:normal;font-size:.72rem;color:var(--accent);font-weight:700;margin-top:2px}
.yr.q:not(.ystart) .when{padding-top:2px;padding-bottom:2px}
.yr.ystart{margin-top:8px}
.yr.ystart .when{border-top:2px solid var(--line)}

.yr.past{opacity:.55}
.yr.q.empty.ystart .when span{display:inline}
.qnote{margin:18px 0 4px;font-size:.8rem;color:var(--sub);font-weight:700;text-align:center;border-top:1.5px dashed var(--line);padding-top:8px}
.fam{width:100%;font-size:.75rem;color:var(--sub)}
.chip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);border-left:5px solid var(--c,var(--sub));background:var(--card);border-radius:8px;padding:5px 10px;font-size:.92rem;text-align:left;line-height:1.4;max-width:100%}
.chip .cat{font-size:.7rem;color:var(--c);font-weight:700;white-space:nowrap}
.chip .amt{font-size:.78rem;white-space:nowrap}
.amt.out{color:var(--red)} .amt.in{color:var(--green)}
.chip.goal{--c:var(--gold);background:var(--gold-soft)}
.chip.goal.done{opacity:.6;text-decoration:line-through}
.add{border:1px dashed var(--line);background:transparent;color:var(--sub);width:30px;height:30px;border-radius:50%;font-size:1rem;line-height:1;padding:0}
.yr.empty .add{opacity:.45}
.past{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px}

/* ---- money ---- */
.inline-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline-fields label{font-size:.85rem;color:var(--sub)}
.unit{display:flex;align-items:center;gap:6px}
.unit input{min-width:0}
.chart-box{overflow-x:auto;margin:6px -4px 0}
.chart{display:block;width:100%;min-width:320px;height:auto}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .gl.zero{stroke:var(--ink);stroke-width:1.5;opacity:.5}
.chart .yl{fill:var(--sub);font-size:18px;text-anchor:end}
.chart .xl{fill:var(--sub);font-size:18px;text-anchor:middle}
.chart .ar.pos{fill:var(--accent);opacity:.15}
.chart .ar.neg{fill:var(--red);opacity:.2}
.chart .ln{fill:none;stroke-width:3;stroke-linejoin:round}
.chart .ln.pos{stroke:var(--accent)} .chart .ln.neg{stroke:var(--red)}
.chart .rt{stroke:var(--sub);stroke-dasharray:4 5;stroke-width:1.5}

.flows{list-style:none;margin:0;padding:0}

.flows button{width:100%;background:none;border:0;display:flex;justify-content:space-between;gap:12px;padding:12px 2px;text-align:left}
.flows .nm small{display:block;color:var(--sub);font-size:.78rem}
.flows .val{font-weight:700;white-space:nowrap}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem;white-space:nowrap}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:500;position:sticky;top:0;background:var(--card)}
td:first-child,th:first-child{text-align:left}
tr.neg td:last-child{color:var(--red);font-weight:700}

/* ---- goals ---- */
.goals{display:flex;flex-direction:column;gap:14px}
.goal-card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:12px;padding:14px 16px}
.goal-card.done{border-top-color:var(--green);opacity:.75}
.gh{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:start}
.check{width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);background:transparent;color:transparent;font-weight:900}
.done .check{background:var(--green);border-color:var(--green);color:#fff}
.gmeta{font-size:.8rem;color:var(--sub);margin-top:2px}
.why{margin:10px 0 0;padding-left:12px;border-left:3px solid var(--gold-soft);color:var(--sub);font-size:.9rem;white-space:pre-wrap}

.steps li{display:flex;align-items:center;gap:8px;padding:4px 0}

.addstep input{flex:1;min-width:0}
.edit{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.8rem;color:var(--sub);min-height:32px}

/* ---- forms / sheet ---- */
label.f{display:block;font-size:.85rem;color:var(--sub);margin:12px 0 4px}
input[type=text],input[type=number],select,textarea{
  width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.hint{font-size:.8rem;color:var(--accent);margin-top:4px}

.sheet-wrap{position:fixed;inset:0;background:rgba(15,26,43,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}

.sheet h3{font-size:1.15rem}
.sheet .foot{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---- nav ---- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--sub);min-height:56px}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90%}
#toast.show{opacity:1}
.welcome{padding-top:24px}
.welcome h1{font-size:2.4rem}
.welcome .panel{margin-top:22px}
.empty-note{padding:20px 16px;text-align:center;color:var(--sub);border:1.5px dashed var(--line);border-radius:14px;background:var(--card)}
.empty-note .btn{margin-top:12px}
/* ---- family table ---- */
.seg{display:inline-flex;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px;margin:4px 0 8px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 16px;font-size:.9rem;color:var(--sub);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--paper);font-weight:700}
.mo{font-size:.72rem;color:var(--sub);white-space:nowrap;font-weight:500}
.who{font-size:.72rem;font-weight:700;color:var(--ink);background:var(--accent-soft);border-radius:4px;padding:0 5px;white-space:nowrap}
.ftable-box{overflow:auto;max-height:70vh;max-height:calc(100dvh - 230px);border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:8px}
.ft{border-collapse:separate;border-spacing:0;white-space:normal;font-size:.85rem;width:max-content;min-width:100%}
.ft th,.ft td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px}
.ft thead th{position:sticky;top:0;z-index:3;background:var(--card);color:var(--ink);font-weight:700;min-width:124px;border-bottom:2px solid var(--ink)}
.ft thead th small{display:block;color:var(--sub);font-weight:400;font-size:.7rem}
.ft .stick{position:sticky;left:0;z-index:2;background:var(--card);min-width:58px;width:58px}
.ft thead .stick{z-index:4}
.ft tbody th.stick b{display:block;font-size:.9rem}
.ft tbody th.stick span{font-size:.7rem;color:var(--sub);font-weight:400}
.ft td{min-width:124px;max-width:170px}
.ft td.need{min-width:92px;text-align:right;white-space:nowrap}
.ft .fa{display:block;font-size:.72rem;color:var(--sub);margin-bottom:3px}
.ft .fa.born{color:var(--accent);font-weight:700}
.ft .chip{display:flex;flex-wrap:wrap;width:100%;font-size:.8rem;padding:4px 7px;margin-bottom:4px}
.ft tr.now th.stick{box-shadow:inset 4px 0 0 var(--accent)}
.ft tr.now td,.ft tr.now th{background:var(--accent-soft)}
.ft tr.decrow td{background:var(--paper);font-weight:900;font-size:.95rem;padding:10px 8px 4px;position:sticky;left:0}
.ft tr.empty td,.ft tr.empty th{padding-top:3px;padding-bottom:3px}
.ft tr.ystart th,.ft tr.ystart td{border-top:2px solid var(--line)}
.ft tr.past th,.ft tr.past td{opacity:.55}
.ft .ql{display:block;font-size:.72rem;color:var(--accent);font-weight:700}
.ft tr.decrow.note td{font-size:.8rem;font-weight:700;color:var(--sub);background:var(--card)}
.cadd{display:block;border:1px dashed var(--line);background:none;color:var(--sub);border-radius:6px;width:100%;min-height:26px;font-size:.8rem;opacity:.55;padding:0}
.cadd:hover,.cadd:focus-visible{opacity:1}
.per-sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.per-sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.per-sum b{display:block}
.per-sum small{color:var(--sub);font-size:.78rem;display:block}
.presets{list-style:none;margin:6px 0 0;padding:0}
.presets li{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.presets label{display:flex;align-items:center;gap:8px;min-height:40px;font-size:.92rem}
.presets label input{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0}

.presets input[type=number]{min-height:38px;padding:6px 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<main class="wrap" id="view"></main>

<nav class="tabs" id="tabs" hidden aria-label="画面の切り替え">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 17h18M6 17v-3M10 17v-6M14 17v-3M18 17v-6"/></svg>設計図</button>
  <button data-tab="timeline"><svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>年表</button>
  <button data-tab="money"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 7l3.5 5 3.5-5M12 12v6M9 13h6M9 16h6"/></svg>お金</button>
  <button data-tab="goals"><svg viewBox="0 0 24 24"><path d="M5 21V4h12l-2.5 4L17 12H5"/></svg>目標</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>設定</button>
</nav>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header><h3 id="sheetTitle"></h3><button class="x" onclick="closeSheet()" aria-label="閉じる">×</button></header>
    <div id="sheetBody"></div>
    <p class="err" id="sheetErr"></p>
    <div class="foot">
      <button class="btn danger small" id="sheetDel" onclick="sheetDelete()">削除</button>
      <button class="btn" onclick="sheetSaveRun()" style="margin-left:auto">保存</button>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const KEY = 'jinsei-sekkeizu-v1';
const Y = new Date().getFullYear();
const M = new Date().getMonth()+1;
const evSort = (a,b) => a.year-b.year || (num(a.month)||0)-(num(b.month)||0);
const ymLabel = e => `${e.year}年${e.month?e.month+'月':''}`;
const monthTag = e => e.month ? `<span class="mo">${e.month}月</span>` : '';
const CATS = {
  work:{l:'仕事',c:'#2E6FD8'}, family:{l:'家族',c:'#D0648E'}, home:{l:'住まい',c:'#9B6B3F'},
  learn:{l:'学び',c:'#7A5CC2'}, health:{l:'健康',c:'#2F8F66'}, play:{l:'趣味・旅',c:'#E07B2E'},
  money:{l:'お金',c:'#1C9AA0'}, other:{l:'その他',c:'#7D8898'}
};
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v, d=0) => { const n = parseFloat(v); return isFinite(n) ? n : d; };

function defaults(){
  return { profile:{name:'',birthYear:Y-40,lifespan:90,retireAge:65,family:[]},
           events:[], money:{savings:0,rate:1,incomes:[],expenses:[]}, goals:[] };
}
function normalize(d){
  const b = defaults();
  const o = Object.assign(b, d || {});
  o.profile = Object.assign(defaults().profile, o.profile || {});
  o.profile.family = Array.isArray(o.profile.family) ? o.profile.family : [];
  o.money = Object.assign(defaults().money, o.money || {});
  ['incomes','expenses'].forEach(k => { if(!Array.isArray(o.money[k])) o.money[k] = []; });
  ['events','goals'].forEach(k => { if(!Array.isArray(o[k])) o[k] = []; });
  o.goals.forEach(g => { if(!Array.isArray(g.steps)) g.steps = []; });
  o.events.forEach(e => { if(!e.who) e.who = 'me'; });
  return o;
}
function load(){
  try { const r = localStorage.getItem(KEY); if(r) return normalize(JSON.parse(r)); } catch(e) {}
  return null;
}
function save(){
  if(S && S.events) S.events.sort(evSort);
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('保存できませんでした。ブラウザの保存領域を確認してください'); }
}
let S = load();
let tab = 'home';
let tlOnlyFilled = false;
let tlMode = null; // 'list' | 'family'（null は家族がいれば一覧表）

const P = () => S.profile;
const nowAge = () => Y - P().birthYear;
const yOf = a => P().birthYear + a;
const aOf = y => y - P().birthYear;
const people = () => [{id:'me', name:P().name||'わたし', birthYear:P().birthYear}, ...P().family];
const personOf = id => people().find(m=>m.id===id) || people()[0];
const whoTag = e => (e.who && e.who!=='me') ? `<span class="who">${h(personOf(e.who).name)}</span>` : '';

function fm(v){
  v = Math.round(v); const a = Math.abs(v);
  if(a >= 10000) return (v<0?'−':'') + (a/10000).toFixed(a>=100000?0:1).replace(/\.0$/,'') + '億円';
  return (v<0?'−':'') + a.toLocaleString('ja-JP') + '万円';
}
function fmShort(v){
  const a = Math.abs(v);
  if(a >= 10000) return (v<0?'−':'') + +(a/10000).toFixed(1) + '億';
  return (v<0?'−':'') + a.toLocaleString('ja-JP') + '万';
}
let toastTimer;
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2200); }

/* ---------- simulation ---------- */
function sim(){
  const p = P(), m = S.money, a0 = Math.max(0, nowAge());
  let bal = num(m.savings); const rows = [];
  for(let a=a0; a<=p.lifespan; a++){
    const yr = yOf(a); let inc=0, exp=0, one=0;
    m.incomes.forEach(i => { if(a>=i.from && a<=i.to) inc += num(i.amount); });
    m.expenses.forEach(i => { if(a>=i.from && a<=i.to) exp += num(i.amount); });
    S.events.forEach(e => { if(e.year===yr && e.amt) one += (e.dir==='in' ? 1 : -1) * num(e.amt); });
    S.goals.forEach(g => { if(!g.done && g.age===a && g.cost) one -= num(g.cost); });
    const interest = bal > 0 ? bal * num(m.rate)/100 : 0;
    bal = bal + interest + inc - exp + one;
    rows.push({a, yr, inc, exp, one, interest, bal});
  }
  return rows;
}
function upcoming(){
  const list = [];
  S.events.forEach(e => { if(e.year>Y || (e.year===Y && (!e.month || e.month>=M))) list.push({kind:'ev', year:e.year, month:e.month, title:e.title, cat:e.cat, id:e.id, who:e.who}); });
  S.goals.forEach(g => { const yr=yOf(g.age); if(!g.done && yr>=Y) list.push({kind:'goal', year:yr, title:g.title, id:g.id}); });
  return list.sort(evSort);
}

/* ---------- render ---------- */
function render(){
  const nav = $('#tabs');
  if(!S){ nav.hidden = true; $('#view').innerHTML = vWelcome(); return; }
  nav.hidden = false;
  nav.querySelectorAll('button').forEach(b => { if(b.dataset.tab===tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  const v = {home:vHome, timeline:vTimeline, money:vMoney, goals:vGoals, settings:vSettings}[tab];
  $('#view').innerHTML = v();
}
function go(t){ tab=t; render(); window.scrollTo(0,0); }
$('#tabs').addEventListener('click', e => { const b=e.target.closest('button[data-tab]'); if(b) go(b.dataset.tab); });

function vWelcome(){
  return `<section class="welcome">
    <h1>人生設計図</h1>
    <p class="lead">年表・お金・目標を一枚にまとめて、これからの人生を見渡すためのノートです。データはこの端末のブラウザの中だけに保存されます。</p>
    <div class="panel">
      <label class="f" for="w_name">名前（空欄でもOK）</label>
      <input type="text" id="w_name" placeholder="例：佐々木">
      <div class="two">
        <div><label class="f" for="w_by">生まれた年（西暦）</label><input type="number" inputmode="numeric" id="w_by" value="${Y-40}"></div>
        <div><label class="f" for="w_ret">退職予定の年齢</label><input type="number" inputmode="numeric" id="w_ret" value="65"></div>
      </div>
      <label class="f" for="w_life">何歳までの設計図にしますか</label>
      <input type="number" inputmode="numeric" id="w_life" value="90">
      <p class="err" id="w_err"></p>
      <button class="btn" style="width:100%;margin-top:6px" onclick="startApp()">設計図をつくる</button>
    </div>
    <p style="text-align:center;margin-top:14px"><button class="link" onclick="startSample()">サンプルデータで試してみる</button></p>
  </section>`;
}
function startApp(){
  const by = Math.round(num($('#w_by').value, NaN)), life = Math.round(num($('#w_life').value, NaN)), ret = Math.round(num($('#w_ret').value, 65));
  const err = $('#w_err');
  if(!(by>1900 && by<=Y)) { err.textContent='生まれた年を西暦4桁で入力してください'; return; }
  if(!(life > Y-by && life <= 120)) { err.textContent=`設計図の年齢は ${Y-by+1}〜120 の範囲で入力してください`; return; }
  S = defaults();
  Object.assign(S.profile, {name:$('#w_name').value.trim(), birthYear:by, lifespan:life, retireAge:ret});
  save(); tab='home'; render(); toast('設計図をつくりました');
}
function startSample(){
  S = defaults(); const by = Y-45;
  Object.assign(S.profile, {name:'', birthYear:by, lifespan:90, retireAge:65,
    family:[{id:'fp',name:'パートナー',birthYear:by+2,birthMonth:''},{id:'fs',name:'長男',birthYear:Y-15,birthMonth:6},{id:'fd',name:'長女',birthYear:Y-11,birthMonth:2}]});
  S.money = {savings:800, rate:1, incomes:[
      {id:uid(),name:'給与（手取り）',amount:620,from:45,to:64},
      {id:uid(),name:'年金（世帯）',amount:260,from:65,to:90}],
    expenses:[
      {id:uid(),name:'生活費',amount:340,from:45,to:90},
      {id:uid(),name:'住宅ローン',amount:110,from:45,to:62},

/* ---------- home ---------- */
function ruler(){
  const p=P(), L=p.lifespan, a0=nowAge(), W=1000, x0=30, x1=970, ax=150;
  const X = a => x0 + (x1-x0) * Math.min(Math.max(a,0),L) / L;
  let s = `<svg viewBox="0 0 ${W} 205" class="ruler" role="img" aria-label="0歳から${L}歳までの人生の物差し。いま${a0}歳">`;
  s += `<line x1="${x0}" x2="${X(a0)}" y1="${ax}" y2="${ax}" class="ax-past"/><line x1="${X(a0)}" x2="${x1}" y1="${ax}" y2="${ax}" class="ax-fut"/>`;
  for(let a=0; a<=L; a++){
    const x=X(a), big=a%10===0, mid=a%5===0;
    s += `<line x1="${x}" x2="${x}" y1="${ax+6}" y2="${ax+(big?24:mid?16:10)}" class="tk${big?' big':''}"/>`;
    if(big) s += `<text x="${x}" y="${ax+52}" class="tl">${a}</text>`;
  }
  if(p.retireAge>0 && p.retireAge<=L){
    const rx=X(p.retireAge);
    s += `<line x1="${rx}" x2="${rx}" y1="${ax-78}" y2="${ax}" class="ret"/><text x="${rx+8}" y="${ax-64}" class="retl">退職 ${p.retireAge}歳</text>`;
  }
  const stack = {};
  const slot = a => { const k=Math.round(a/2); stack[k]=(stack[k]||0)+1; return Math.max(58, ax-18-(stack[k]-1)*20); };
  S.events.slice().sort((a,b)=>a.year-b.year).forEach(e => {
    const a=aOf(e.year); if(a<0||a>L) return;
    s += `<circle cx="${X(a)}" cy="${slot(a)}" r="8" fill="${(CATS[e.cat]||CATS.other).c}"><title>${h(a+'歳 '+e.title)}</title></circle>`;
  });
  S.goals.slice().sort((a,b)=>a.age-b.age).forEach(g => {
    if(g.age<0||g.age>L) return; const x=X(g.age), y=slot(g.age);
    s += `<path d="M${x} ${y-9} L${x+9} ${y} L${x} ${y+9} L${x-9} ${y} Z" class="gm${g.done?'':' open'}"><title>${h(g.age+'歳 目標：'+g.title)}</title></path>`;
  });
  const nx = X(a0), lx = Math.min(Math.max(nx, 95), W-95);
  s += `<g class="now"><line x1="${nx}" x2="${nx}" y1="46" y2="${ax+8}"/><rect x="${lx-78}" y="4" width="156" height="42" rx="21"/><text x="${lx}" y="34">いま ${a0}歳</text></g>`;
  return s + `</svg>`;
}

function vTimeline(){
  const p=P(), a0=nowAge();

    const ret = s.first && a===p.retireAge;
    const when = s.q===0 ? `<b>${a}歳</b><span>${yr}年</span>` : `${s.first?`<b>${a}歳</b><span>${yr}年</span>`:''}<em>${qLabel(s.q)}</em>`;

      <div class="when">${when}</div>

    </li>`;
  });
  return out + `</ol>`;

const qLabel = q => q===0 ? '' : q==='u' ? '月未定' : `${q*3-2}〜${q*3}月`;
const qMonth = q => (q===0 || q==='u') ? "''" : q*3-2;
function tlSlots(){
  const p=P(), a0=nowAge(), out=[];
  for(let a=a0; a<=p.lifespan; a++){
    const yr=yOf(a), evs=S.events.filter(e=>e.year===yr), gs=S.goals.filter(g=>g.age===a);
    if(tlOnlyFilled && !(evs.length+gs.length)) continue;
    out.push({q:0, yr, a, events:evs, goals:gs, first:true, now:a===a0});
  }
  return out;
}
function vFamilyTable(){

  let lastDec = null, noted = false;

    const head = s.q===0 ? `<b>${yr}</b>` : `${s.first?`<b>${yr}</b>`:''}<span class="ql">${qLabel(s.q)}</span>`;
    out += `<tr class="${s.now?'now':''} ${filled?'':'empty'} ${s.first&&s.q!==0?'ystart':''} ${s.past?'past':''}"><th class="stick" scope="row">${head}</th>`;
    ppl.forEach(m=>{
      const age=yr-num(m.birthYear);

  });
  out += `</tbody></table></div>
    <p class="muted" style="margin-top:8px">年齢はその年の誕生日を迎えたあとの年齢です。マスの「＋」から、その人のイベントを追加できます。</p>`;
  return out;

function catOptions(sel){ return Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${v.l}</option>`).join(''); }
function whoOptions(sel){ return people().map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${h(m.name)}</option>`).join(''); }

/* ---------- money ---------- */
function nice(x){ if(!(x>0)) return 100; const m=10**Math.floor(Math.log10(x)), f=x/m; return (f<=1?1:f<=2?2:f<=5?5:10)*m; }
function chart(rows){
  if(rows.length<2) return '<p class="muted">グラフを表示するには、設計図の期間を2年以上にしてください。</p>';
  const W=700,H=300,pl=80,pr=14,pt=20,pb=40;
  const v=rows.map(r=>r.bal); let mx=Math.max(0,...v), mn=Math.min(0,...v); if(mx-mn<1) mx=mn+100;
  const st=nice((mx-mn)/4); mx=Math.ceil(mx/st)*st; mn=Math.floor(mn/st)*st;
  const X=i=>pl+(W-pl-pr)*i/(rows.length-1), Yv=b=>pt+(H-pt-pb)*(mx-b)/(mx-mn), y0=Yv(0);
  const line=rows.map((r,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Yv(r.bal).toFixed(1)}`).join('');
  const area=`${line}L${X(rows.length-1).toFixed(1)},${y0.toFixed(1)}L${X(0).toFixed(1)},${y0.toFixed(1)}Z`;
  let g='';
  for(let k=0; mn+k*st<=mx+1e-9; k++){ const t=mn+k*st, y=Yv(t); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" class="gl${t===0?' zero':''}"/><text x="${pl-8}" y="${y+6}" class="yl">${fmShort(t)}</text>`; }
  rows.forEach((r,i)=>{ if(r.a%10===0) g+=`<text x="${X(i)}" y="${H-12}" class="xl">${r.a}歳</text>`; });
  const ri=rows.findIndex(r=>r.a===P().retireAge);
  if(ri>=0) g+=`<line x1="${X(ri)}" x2="${X(ri)}" y1="${pt}" y2="${H-pb}" class="rt"/><text x="${X(ri)+6}" y="${pt+14}" class="rtl">退職</text>`;

function vGoals(){
  const a0=nowAge();
  const gs=S.goals.slice().sort((a,b)=>(a.done-b.done)||(a.age-b.age));
  let out=`<div class="bar"><h1>目標</h1><button class="btn small" onclick="editGoal()">＋ 目標</button></div>
    <p class="lead">やりたいことを年齢と結びつけて、小さな一歩に分けておきます。</p>`;
  if(!gs.length) return out + `<div class="empty-note" style="margin-top:16px">まだ目標がありません。<br>「いつか」を「何歳で」に置きかえてみましょう。<br><button class="btn" onclick="editGoal()">最初の目標を書く</button></div>`;
  out += `<div class="goals" style="margin-top:16px">`;
  gs.forEach(g=>{
    const c=CATS[g.cat]||CATS.other, sd=g.steps.filter(s=>s.done).length, left=g.age-a0;
    out += `<article class="goal-card ${g.done?'done':''}">
      <div class="gh">
        <button class="check" onclick="toggleGoal('${g.id}')" aria-label="${g.done?'未達成に戻す':'達成にする'}" aria-pressed="${!!g.done}">✓</button>
        <div><h3>${h(g.title)}</h3><p class="gmeta">${g.age}歳まで（${g.done?'達成済み':left>0?'あと'+left+'年':left===0?'今年':left*-1+'年前'}）　${c.l}${num(g.cost)>0?`　必要資金 ${fm(num(g.cost))}`:''}</p></div>
        <button class="edit" onclick="editGoal('${g.id}')">編集</button>
      </div>
      ${g.why?`<p class="why">${h(g.why)}</p>`:''}
      ${g.steps.length?`<div class="progress" style="margin-top:12px"><div style="width:${sd/g.steps.length*100}%"></div></div><p class="muted" style="font-size:.78rem;margin-top:2px">ステップ ${sd} / ${g.steps.length}</p>`:''}
      <ul class="steps">${g.steps.map(s=>`<li><label><input type="checkbox" ${s.done?'checked':''} onchange="toggleStep('${g.id}','${s.id}')"><span class="${s.done?'fin':''}">${h(s.text)}</span></label><button class="x" onclick="delStep('${g.id}','${s.id}')" aria-label="ステップを削除">×</button></li>`).join('')}</ul>
      ${g.done?'':`<div class="addstep"><input type="text" id="st_${g.id}" placeholder="次の一歩を追加" onkeydown="if(event.key==='Enter'&&!event.isComposing)addStep('${g.id}')"><button class="btn ghost small" onclick="addStep('${g.id}')">追加</button></div>`}
    </article>`;
  });
  return out + `</div>`;
}
function findGoal(id){ return S.goals.find(g=>g.id===id); }
function toggleGoal(id){ const g=findGoal(id); if(!g) return; g.done=!g.done; save(); render(); toast(g.done?'達成おめでとうございます':'未達成に戻しました'); }
function toggleStep(gid,sid){ const g=findGoal(gid); const s=g&&g.steps.find(x=>x.id===sid); if(!s) return; s.done=!s.done; save(); render(); }
function delStep(gid,sid){ const g=findGoal(gid); if(!g) return; g.steps=g.steps.filter(x=>x.id!==sid); save(); render(); }
function addStep(gid){
  const g=findGoal(gid), el=$('#st_'+gid); if(!g||!el) return;
  const t=el.value.trim(); if(!t){ el.focus(); return; }
  g.steps.push({id:uid(),text:t,done:false}); save(); render();
  const n=$('#st_'+gid); if(n) n.focus();
}
function editGoal(id){
  const isNew=!id, a0=Math.max(0,nowAge());
  const g = id ? findGoal(id) : {id:uid(), title:'', age:a0+5, cat:'play', cost:'', why:'', done:false, steps:[]};

  openSheet(isNew?'目標を追加':'目標を編集', `
    <label class="f" for="f_title">やりたいこと</label>

    <label class="f" for="f_why">なぜやりたいか</label>

    if(!isFinite(a)||a<0||a>P().lifespan) return `年齢は 0〜${P().lifespan} で入力してください`;

    toast(isNew?'目標を追加しました':'目標を保存しました');
  }, isNew ? null : () => { S.goals=S.goals.filter(x=>x.id!==id); toast('目標を削除しました'); });
}

function setProf(k,v){
  const p=P();
  if(k==='name'){ p.name=v.trim(); save(); toast('保存しました'); return; }
  const n=Math.round(num(v,NaN));
  if(k==='birthYear' && !(n>1900&&n<=Y)){ toast('生まれた年を西暦4桁で入力してください'); render(); return; }
  if(k==='lifespan' && !(n>Y-p.birthYear && n<=120)){ toast(`${Y-p.birthYear+1}〜120 の範囲で入力してください`); render(); return; }
  if(k==='retireAge' && !(n>0&&n<=120)){ toast('退職予定の年齢を入力してください'); render(); return; }
  p[k]=n; save(); render(); toast('保存しました');
}
const PRESETS = [
  {l:'小学校入学', n:7,  e:6,  cat:'learn', mo:4},
  {l:'中学校入学', n:13, e:12, cat:'learn', mo:4},
  {l:'高校入学',   n:16, e:15, cat:'learn', mo:4},
  {l:'大学入学',   n:19, e:18, cat:'learn', mo:4},
  {l:'就職',       n:23, e:22, cat:'work', mo:4},
  {l:'還暦',       n:60, e:60, cat:'family'},
  {l:'古希',       n:70, e:70, cat:'family'},
  {l:'喜寿',       n:77, e:77, cat:'family'},
  {l:'米寿',       n:88, e:88, cat:'family'}
];
let presetRows = [];
function renderPresets(fid){
  const box=$('#f_presets'); if(!box) return;
  const by=Math.round(num($('#f_by').value,NaN)), bm=Math.round(num($('#f_bm').value,0));
  if(!(by>1900&&by<=Y+30)){ box.innerHTML='<p class="muted">生まれた年を入れると、候補が表示されます。</p>'; presetRows=[]; return; }
  const early = bm>=1 && bm<=3, end=yOf(P().lifespan);
  const have = new Set(S.events.filter(e=>e.who===fid).map(e=>e.title));
  presetRows = PRESETS.map(x=>({...x, year: by + (early?x.e:x.n), month: x.mo || (bm>=1&&bm<=12?bm:'')})).filter(x=>x.year>=Y && x.year<=end && !have.has(x.l));
  if(!presetRows.length){ box.innerHTML='<p class="muted">追加できる候補はありません。</p>'; return; }
  box.innerHTML = `<ul class="presets">${presetRows.map((x,i)=>`<li><label><input type="checkbox" id="pr_${i}">${x.l}<small>${x.year}年${x.month?x.month+'月':''}</small></label><input type="number" inputmode="decimal" id="pa_${i}" placeholder="必要資金 万円" aria-label="${x.l}の必要資金（万円）"></li>`).join('')}</ul>
    ${bm?'':'<p class="muted" style="margin-top:6px">入学の年は4〜12月生まれとして計算しています。1〜3月生まれの場合は生まれ月を入れてください。</p>'}`;
}
function editFamily(id){
  const isNew=!id, f = id ? P().family.find(x=>x.id===id) : {id:uid(), name:'', birthYear:'', birthMonth:''};
  if(!f) return;
  const cnt = S.events.filter(e=>e.who===f.id).length;
  openSheet(isNew?'家族を追加':'家族を編集', `
    <label class="f" for="f_name">呼び方</label>
    <input type="text" id="f_name" value="${h(f.name)}" placeholder="例：パートナー、長男、母">

      <div><label class="f" for="f_by">生まれた年（西暦）</label><input type="number" inputmode="numeric" id="f_by" value="${h(f.birthYear)}" oninput="renderPresets('${f.id}')"></div>
      <div><label class="f" for="f_bm">生まれ月（任意）</label><select id="f_bm" onchange="renderPresets('${f.id}')"><option value="">―</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${num(f.birthMonth)===i+1?'selected':''}>${i+1}月</option>`).join('')}</select></div>
    </div>
    <label class="f">定番のライフイベントをまとめて追加</label>
    <div id="f_presets"></div>`,
  () => {
    const n=$('#f_name').value.trim(), by=Math.round(num($('#f_by').value,NaN)), bm=$('#f_bm').value;
    if(!n) return '呼び方を入力してください';
    if(!(by>1900&&by<=Y+30)) return '生まれた年を西暦4桁で入力してください';
    Object.assign(f,{name:n,birthYear:by,birthMonth:bm?+bm:''});
    if(isNew) P().family.push(f);
    let added=0;
    presetRows.forEach((x,i)=>{
      const cb=$('#pr_'+i); if(!cb||!cb.checked) return;
      const amt=num($('#pa_'+i).value);
      S.events.push({id:uid(), who:f.id, year:x.year, month:x.month, title:x.l, cat:x.cat, dir:amt>0?'out':'', amt:amt>0?amt:'', memo:''});
      added++;
    });

  cnt ? `${f.name}さんと、そのイベント${cnt}件を削除します。よろしいですか？` : null);
  renderPresets(f.id);

function exportJSON(){
  try{
    const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download=`jinsei-sekkeizu-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }catch(e){ toast('書き出せませんでした。「データをコピー」を使ってください'); }
}
function copyJSON(){
  if(!navigator.clipboard){ toast('この環境ではコピーできません'); return; }
  navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('データをコピーしました'),()=>toast('コピーできませんでした'));
}
function applyImport(text){
  let d; try{ d=JSON.parse(text); }catch(e){ return 'データの形式が正しくありません'; }
  if(!d || !d.profile || !d.profile.birthYear) return '人生設計図のデータではないようです';
  if(S && !confirm('いまのデータを読み込んだデータで置きかえます。よろしいですか？')) return '';
  S=normalize(d); save(); tab='home'; render(); toast('データを読み込みました'); return null;
}
function importFile(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ const e=applyImport(r.result); if(e) toast(e); };
  r.readAsText(f); inp.value='';
}
function importPaste(){
  openSheet('貼り付けて読み込む', `<label class="f" for="f_json">コピーしたデータ</label><textarea id="f_json" style="min-height:160px" placeholder="ここに貼り付け"></textarea>`,
    () => { const e=applyImport($('#f_json').value.trim()); if(e===null) return; return e || 'KEEP'; }, null);
}
function clearAll(){
  if(!confirm('すべてのデータを消します。元に戻せません。よろしいですか？')) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  S=null; tab='home'; render(); window.scrollTo(0,0);
}

/* ---------- sheet ---------- */
let sheetSave=null, sheetDel=null, sheetDelMsg=null, lastFocus=null;
function openSheet(title, body, onSave, onDel, delMsg){
  sheetDelMsg=delMsg||null;
  lastFocus=document.activeElement;
  $('#sheetTitle').textContent=title; $('#sheetBody').innerHTML=body; $('#sheetErr').textContent='';
  sheetSave=onSave; sheetDel=onDel; $('#sheetDel').hidden=!onDel; $('#sheet').hidden=false;
  document.body.style.overflow='hidden';
}
function closeSheet(){
  $('#sheet').hidden=true; document.body.style.overflow='';
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function sheetSaveRun(){
  if(!sheetSave) return;
  const err=sheetSave();
  if(err==='KEEP') return;
  if(err){ $('#sheetErr').textContent=err; return; }
  if(S) save(); closeSheet(); render();
}
function sheetDelete(){
  if(!sheetDel || !confirm(sheetDelMsg||'削除しますか？')) return;
  sheetDel(); save(); closeSheet(); render();
}
$('#sheet').addEventListener('click', e => { if(e.target.id==='sheet') closeSheet(); });
document.addEventListener('keydown', e => { if(e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });

render();
</script>
